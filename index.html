<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테니스 복식 대진표 & 승패 기록표</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SheetJS for Excel upload/download -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        tennis: {
                            green: '#15803d',
                            court: '#166534',
                            yellow: '#ccff00',
                            accent: '#84cc16',
                            dark: '#0f172a',
                            light: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .tennis-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-lime-400 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-lime-400/20">
                        <i class="fa-solid fa-tennis-ball"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-white tracking-wide leading-tight">테니스 매칭 & 기록 관리</h1>
                        <p class="text-xs text-lime-400 font-medium">동호회 월별 대회 대진표 생성기</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="loadDemoData()" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-lime-300 font-medium rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> 시범 데이터 불러오기
                    </button>
                    <button onclick="resetAllData()" class="px-3 py-1.5 text-xs bg-rose-950/60 hover:bg-rose-900 text-rose-300 font-medium rounded-lg border border-rose-800/60 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-rotate-right"></i> 전체 초기화
                    </button>
                </div>
            </div>

            <!-- Tab Navigation Bar -->
            <div class="flex space-x-1 sm:space-x-4 border-t border-slate-800/60 pt-1 overflow-x-auto">
                <button onclick="switchTab('tab-members')" id="nav-tab-members" class="nav-tab text-sm font-semibold px-4 py-2.5 border-b-2 border-lime-400 text-lime-400 flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-users"></i> 회원 명부 <span id="member-count-badge" class="ml-1 px-1.5 py-0.5 text-xs bg-slate-800 rounded-full text-slate-300">0</span>
                </button>
                <button onclick="switchTab('tab-session')" id="nav-tab-session" class="nav-tab text-sm font-semibold px-4 py-2.5 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-calendar-check"></i> 모임/참석 관리
                </button>
                <button onclick="switchTab('tab-matches')" id="nav-tab-matches" class="nav-tab text-sm font-semibold px-4 py-2.5 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-trophy"></i> 대진표 & 경기 결과
                </button>
                <button onclick="switchTab('tab-stats')" id="nav-tab-stats" class="nav-tab text-sm font-semibold px-4 py-2.5 border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-chart-line"></i> 회원별 승패 통계
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">

        <!-- Notification Banner -->
        <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

        <!-- TAB 1: 회원 관리 (Member List) -->
        <section id="tab-members" class="tab-content block space-y-6">
            <div class="tennis-card rounded-2xl p-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4 pb-3 border-b border-slate-800">
                    <div class="flex items-center gap-3">
                        <h2 class="text-lg font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-users text-lime-400"></i> 회원 명부
                        </h2>
                        <span class="text-xs text-slate-400" id="gender-summary-text">남 0명 / 여 0명</span>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                        <button onclick="downloadExcelTemplate()" class="px-3 py-2 text-xs bg-slate-800 hover:bg-slate-700 text-lime-300 font-medium rounded-xl border border-slate-700 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-file-excel"></i> 엑셀 양식 다운로드
                        </button>
                        <label class="px-3 py-2 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-xl border border-slate-700 transition flex items-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-file-import"></i> 엑셀 업로드
                            <input type="file" id="excel-upload-input" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)" class="hidden">
                        </label>
                        <button onclick="addRowMember()" class="px-4 py-2 text-xs bg-lime-400 hover:bg-lime-300 text-slate-950 font-bold rounded-xl transition flex items-center gap-1.5 shadow-lg shadow-lime-400/10">
                            <i class="fa-solid fa-plus"></i> 행 추가
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900/90 text-slate-400 text-xs uppercase border-b border-slate-800">
                            <tr>
                                <th class="py-3 px-4 text-center">No</th>
                                <th class="py-3 px-4">회원명</th>
                                <th class="py-3 px-4">성별</th>
                                <th class="py-3 px-4 text-center">총 경기</th>
                                <th class="py-3 px-4 text-center">승 / 패</th>
                                <th class="py-3 px-4 text-right">관리</th>
                            </tr>
                        </thead>
                        <tbody id="member-table-body" class="divide-y divide-slate-800 text-slate-200">
                            <!-- Dynamic member rows render here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- TAB 2: 모임 및 참석 관리 (Session & Attendance) -->
        <section id="tab-session" class="tab-content hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Session Settings Card -->
                <div class="tennis-card rounded-2xl p-6 space-y-5">
                    <h2 class="text-base font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-sliders text-lime-400"></i> 모임 조건 설정
                    </h2>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">모임 날짜</label>
                        <input type="date" id="session-date-picker" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-lime-400">
                    </div>

                    <button onclick="goToMatchesTab()" class="w-full py-3 bg-lime-400 hover:bg-lime-300 text-slate-950 font-bold rounded-xl transition text-sm shadow-lg shadow-lime-400/10 flex items-center justify-center gap-2">
                        <span>대진표 작성으로 이동</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

                <!-- Attendance Checkbox Grid Card -->
                <div class="md:col-span-2 tennis-card rounded-2xl p-6">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                        <div>
                            <h2 class="text-base font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-user-check text-lime-400"></i> 참석자 선택
                            </h2>
                            <p class="text-xs text-slate-400 mt-0.5">오늘 모임에 참석한 회원을 체크하세요.</p>
                        </div>

                        <div class="flex items-center gap-2">
                            <span id="attendee-count-badge" class="px-2.5 py-1 text-xs bg-lime-400/10 text-lime-400 border border-lime-400/30 rounded-lg font-bold">참석자: 0명</span>
                            <button onclick="selectAllAttendees(true)" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700">전체 선택</button>
                            <button onclick="selectAllAttendees(false)" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700">전체 해제</button>
                        </div>
                    </div>

                    <div id="attendance-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <!-- Dynamic Checkbox Grid -->
                    </div>
                </div>
            </div>
        </section>

        <!-- TAB 3: 대진표 & 경기 결과 (Matches & Scores) -->
        <section id="tab-matches" class="tab-content hidden space-y-6">
            <div class="tennis-card rounded-2xl p-6">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span id="current-mode-badge" class="px-2.5 py-0.5 text-xs font-bold bg-lime-400/20 text-lime-300 border border-lime-400/40 rounded-md">동일 성별 복식</span>
                            <span id="session-info-text" class="text-xs text-slate-400">날짜: - | 참석자 0명</span>
                        </div>
                        <h2 class="text-lg font-bold text-white">매칭 대진표 생성 & 결과 기록</h2>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                        <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5">
                            <i class="fa-solid fa-calendar-days text-lime-400 text-xs"></i>
                            <select id="match-month-select" onchange="changeMatchMonth(this.value)" class="bg-transparent text-xs font-bold text-slate-200 focus:outline-none cursor-pointer">
                                <option value="all">전체 월 대진표</option>
                            </select>
                        </div>

                        <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5">
                            <i class="fa-solid fa-layer-group text-lime-400 text-xs"></i>
                            <select id="match-mode-select" onchange="changeMatchMode(this.value)" class="bg-transparent text-xs font-bold text-slate-200 focus:outline-none cursor-pointer">
                                <option value="same" class="bg-slate-900 text-slate-200">동일 성별 복식</option>
                                <option value="mixed" class="bg-slate-900 text-slate-200">혼합 복식 (혼복)</option>
                            </select>
                        </div>

                        <button onclick="generateNextRoundMatches()" class="px-4 py-2.5 bg-lime-400 hover:bg-lime-300 text-slate-950 font-extrabold text-xs rounded-xl shadow-lg shadow-lime-400/20 transition flex items-center gap-2">
                            <i class="fa-solid fa-shuffle"></i>
                            <span id="btn-generate-text">팀 조합하기 (1회차 기준 생성)</span>
                        </button>
                        <button onclick="clearCurrentMatches()" class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-rose-400 text-xs rounded-xl border border-slate-700 transition">
                            <i class="fa-solid fa-trash-can"></i> 대진표 초기화
                        </button>
                    </div>
                </div>

                <!-- Attendee Game Counter Summary -->
                <div class="mt-4 p-3 bg-slate-900/80 rounded-xl border border-slate-800/80">
                    <span class="text-xs font-semibold text-slate-400 block mb-2"><i class="fa-solid fa-chart-simple text-lime-400"></i> 참석자별 생성된 경기 수:</span>
                    <div id="attendee-game-counter" class="flex flex-wrap gap-2">
                        <!-- Dynamic counters per attendee -->
                    </div>
                </div>
            </div>

            <!-- Matches List Container -->
            <div id="matches-container" class="space-y-4">
                <!-- Matches rendered dynamically -->
            </div>
        </section>

        <!-- TAB 4: 승패 통계 (Member Statistics) -->
        <section id="tab-stats" class="tab-content hidden space-y-6">
            <div class="tennis-card rounded-2xl p-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-800">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-lime-400"></i> 회원별 승패 통계
                    </h2>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5">
                            <i class="fa-solid fa-filter text-lime-400 text-xs"></i>
                            <select id="stats-month-select" onchange="changeStatsMonth(this.value)" class="bg-transparent text-xs font-bold text-slate-200 focus:outline-none cursor-pointer">
                                <option value="all">전체 누적 통계</option>
                            </select>
                        </div>
                        <button onclick="exportToCSV()" class="px-3 py-2 text-xs bg-slate-800 hover:bg-slate-700 text-lime-300 font-medium rounded-xl border border-slate-700 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-download"></i> CSV 다운로드
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-900/90 text-slate-400 text-xs uppercase border-b border-slate-800">
                            <tr>
                                <th class="py-3 px-4 text-center">순위</th>
                                <th class="py-3 px-4">선수명</th>
                                <th class="py-3 px-4">성별</th>
                                <th class="py-3 px-4 text-center">총 경기</th>
                                <th class="py-3 px-4 text-center">승</th>
                                <th class="py-3 px-4 text-center">패</th>
                                <th class="py-3 px-4 text-center">승률</th>
                                <th class="py-3 px-4 text-center">총 득점</th>
                                <th class="py-3 px-4 text-center">총 실점</th>
                                <th class="py-3 px-4 text-center">득실차</th>
                            </tr>
                        </thead>
                        <tbody id="stats-table-body" class="divide-y divide-slate-800 text-slate-200">
                            <!-- Dynamic stats render -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <footer class="bg-slate-900/80 border-t border-slate-800 py-4 mt-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            테니스 동호회 복식 대진표 & 승패 기록 관리 시스템 &copy; 2026
        </div>
    </footer>

    <!-- Custom Confirmation Modal -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm items-center justify-center p-4">
        <div class="tennis-card rounded-2xl p-6 max-w-sm w-full space-y-4 text-center border border-slate-700 shadow-2xl">
            <div class="w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="confirm-modal-title" class="text-lg font-bold text-white">확인</h3>
            <p id="confirm-modal-message" class="text-xs text-slate-300 leading-relaxed"></p>
            <div class="flex items-center gap-2 pt-2">
                <button onclick="handleConfirmCancel()" class="flex-1 py-2.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition border border-slate-700">취소</button>
                <button onclick="handleConfirmYes()" class="flex-1 py-2.5 text-xs bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl transition shadow-lg shadow-rose-600/30">확인</button>
            </div>
        </div>
    </div>

    <script>
        /* State Data Storage */
        let appData = {
            members: [], // { id, name, gender }
            sessionDate: new Date().toISOString().split('T')[0],
            matchMode: 'same', // 'same' | 'mixed'
            attendees: [], // array of member ids
            matches: [], // { id, round, date, teamA: [id1, id2], teamB: [id3, id4], scoreA: null, scoreB: null }
            selectedMatchMonth: 'all',
            selectedStatsMonth: 'all'
        };

        let pendingConfirmAction = null;

        // Demo & Reset Helpers
        function loadDemoData() {
            showConfirmModal(
                '시범 데이터 불러오기',
                '현재 데이터가 초기화되고 시범 데이터(회원 8명)가 불러와집니다. 진행하시겠습니까?',
                () => {
                    const demoMembers = [
                        { id: 'm_1', name: '김테니스', gender: '남' },
                        { id: 'm_2', name: '이서브', gender: '남' },
                        { id: 'm_3', name: '박스매시', gender: '남' },
                        { id: 'm_4', name: '최발리', gender: '남' },
                        { id: 'm_5', name: '정라켓', gender: '여' },
                        { id: 'm_6', name: '한코트', gender: '여' },
                        { id: 'm_7', name: '윤랠리', gender: '여' },
                        { id: 'm_8', name: '강엔드', gender: '여' }
                    ];
                    
                    appData = {
                        members: demoMembers,
                        sessionDate: new Date().toISOString().split('T')[0],
                        matchMode: 'same',
                        attendees: demoMembers.map(m => m.id),
                        matches: [],
                        selectedMatchMonth: 'all',
                        selectedStatsMonth: 'all'
                    };
                    saveToLocalStorage();
                    renderAll();
                    showToast('시범 데이터가 새로 불러와졌습니다.', 'success');
                }
            );
        }

        function resetAllData() {
            showConfirmModal(
                '전체 데이터 초기화',
                '회원 명단, 참석자 설정, 모든 대진표 및 점수 데이터가 전부 삭제됩니다. 계속하시겠습니까?',
                () => {
                    appData = {
                        members: [],
                        sessionDate: new Date().toISOString().split('T')[0],
                        matchMode: 'same',
                        attendees: [],
                        matches: [],
                        selectedMatchMonth: 'all',
                        selectedStatsMonth: 'all'
                    };
                    saveToLocalStorage();
                    renderAll();
                    showToast('모든 데이터가 초기화되었습니다.', 'success');
                }
            );
        }

        // Excel Download & Upload Handlers
        function downloadExcelTemplate() {
            const templateData = [
                ["이름", "성별"],
                ["홍길동", "남"],
                ["김철수", "남"],
                ["이영희", "여"],
                ["박민수", "남"],
                ["최수진", "여"],
                ["정우성", "남"],
                ["한지민", "여"],
                ["강동원", "남"]
            ];

            const ws = XLSX.utils.aoa_to_sheet(templateData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "회원명부양식");
            XLSX.writeFile(wb, "테니스_회원명부_양식.xlsx");
            showToast('엑셀 양식이 다운로드되었습니다.', 'success');
        }

        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (!json || json.length < 2) {
                        showToast('엑셀 파일에 읽을 데이터가 없습니다.', 'error');
                        return;
                    }

                    const headerRow = json[0];
                    let nameIdx = -1;
                    let genderIdx = -1;

                    headerRow.forEach((col, idx) => {
                        if (typeof col === 'string') {
                            const clean = col.trim();
                            if (clean === '이름' || clean === '회원명' || clean === '선수명') nameIdx = idx;
                            if (clean === '성별') genderIdx = idx;
                        }
                    });

                    if (nameIdx === -1) {
                        nameIdx = 0;
                        genderIdx = 1;
                    }

                    let addedCount = 0;
                    let duplicateCount = 0;

                    for (let i = 1; i < json.length; i++) {
                        const row = json[i];
                        if (!row || row.length === 0) continue;

                        const nameVal = row[nameIdx] ? String(row[nameIdx]).trim() : '';
                        let genderVal = genderIdx !== -1 && row[genderIdx] ? String(row[genderIdx]).trim() : '남';

                        if (!nameVal) continue;

                        if (genderVal.includes('여') || genderVal.toLowerCase().includes('female') || genderVal === 'F') {
                            genderVal = '여';
                        } else {
                            genderVal = '남';
                        }

                        const exists = appData.members.some(m => m.name === nameVal);
                        if (exists) {
                            duplicateCount++;
                            continue;
                        }

                        const newId = 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                        appData.members.push({
                            id: newId,
                            name: nameVal,
                            gender: genderVal
                        });
                        if (!appData.attendees.includes(newId)) {
                            appData.attendees.push(newId);
                        }
                        addedCount++;
                    }

                    saveToLocalStorage();
                    renderAll();

                    if (addedCount > 0) {
                        showToast(`${addedCount}명의 회원이 등록되었습니다.${duplicateCount > 0 ? ` (중복 ${duplicateCount}명 제외)` : ''}`, 'success');
                    } else if (duplicateCount > 0) {
                        showToast(`모두 이미 등록된 회원입니다. (${duplicateCount}명 중복)`, 'info');
                    } else {
                        showToast('추가된 회원이 없습니다.', 'info');
                    }

                } catch (err) {
                    console.error(err);
                    showToast('엑셀 파일을 읽는 중 오류가 발생했습니다.', 'error');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // Local Storage Helpers
        function saveToLocalStorage() {
            try {
                localStorage.setItem('tennis_app_data_v1', JSON.stringify(appData));
            } catch (e) {
                console.error('Failed to save to localStorage', e);
            }
        }

        function loadFromLocalStorage() {
            try {
                const data = localStorage.getItem('tennis_app_data_v1');
                if (data) {
                    const parsed = JSON.parse(data);
                    appData = {
                        members: parsed.members || [],
                        sessionDate: parsed.sessionDate || new Date().toISOString().split('T')[0],
                        matchMode: parsed.matchMode || 'same',
                        attendees: parsed.attendees || [],
                        matches: parsed.matches || [],
                        selectedMatchMonth: parsed.selectedMatchMonth || 'all',
                        selectedStatsMonth: parsed.selectedStatsMonth || 'all'
                    };
                }
            } catch (e) {
                console.error('Failed to load from localStorage', e);
            }
        }

        function getAvailableMonths() {
            const months = new Set();
            if (appData.sessionDate) {
                months.add(appData.sessionDate.substring(0, 7));
            }
            appData.matches.forEach(m => {
                const d = m.date || appData.sessionDate;
                if (d) months.add(d.substring(0, 7));
            });
            return Array.from(months).sort().reverse();
        }

        // Notification Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800 border border-slate-700';
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';

            toast.className = `${bgColor} text-white text-xs px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;

            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Custom Confirm Modal Logic
        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const titleEl = document.getElementById('confirm-modal-title');
            const msgEl = document.getElementById('confirm-modal-message');
            
            if (!modal || !titleEl || !msgEl) {
                if (onConfirm) onConfirm();
                return;
            }

            titleEl.innerText = title;
            msgEl.innerText = message;
            pendingConfirmAction = onConfirm;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function handleConfirmYes() {
            const modal = document.getElementById('confirm-modal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
            if (pendingConfirmAction) {
                const action = pendingConfirmAction;
                pendingConfirmAction = null;
                action();
            }
        }

        function handleConfirmCancel() {
            const modal = document.getElementById('confirm-modal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
            pendingConfirmAction = null;

        function generateNextRoundMatches() {
            const attendeeIds = [...appData.attendees];

            if (attendeeIds.length < 4) {
                showToast('경기 완성을 위해 최소 4명의 참석자가 필요합니다.', 'error');
                return;
            }

            const attendeeMembers = appData.members.filter(m => attendeeIds.includes(m.id));

            // Map attendee order index for secondary sorting
            const memberOrderMap = {};
            attendeeMembers.forEach((m, idx) => {
                memberOrderMap[m.id] = idx;
            });

            // Calculate current actual game counts per player
            const gameCounts = {};
            attendeeIds.forEach(id => gameCounts[id] = 0);
            appData.matches.forEach(m => {
                [...m.teamA, ...m.teamB].forEach(pId => {
                    if (gameCounts[pId] !== undefined) gameCounts[pId]++;
                });
            });

            const maxG = attendeeIds.length > 0 ? Math.max(...attendeeIds.map(id => gameCounts[id])) : 0;
            let targetGameCount = appData.matches.length > 0 ? maxG + 1 : 1;

            // Record historical partner counts to avoid repeat partners
            const partnerHistory = {};
            appData.matches.forEach(m => {
                const addPair = (p1, p2) => {
                    const key = [p1, p2].sort().join('_');
                    partnerHistory[key] = (partnerHistory[key] || 0) + 1;
                };
                addPair(m.teamA[0], m.teamA[1]);
                addPair(m.teamB[0], m.teamB[1]);
            });

            let newMatchesCreated = 0;
            let simulationGameCounts = { ...gameCounts };
            let loopSafety = 0;

            // Outer loop attempts match generation for targetGameCount.
            // If no match can be formed at targetGameCount due to gender distribution or odd counts,
            // automatically advance targetGameCount to targetGameCount + 1 to avoid stopping.
            while (loopSafety < 100) {
                loopSafety++;

                let matchCreatedInThisPass = false;

                if (appData.matchMode === 'mixed') {
                    // Mixed Doubles Mode: Need 2 males + 2 females
                    const eligibleMales = attendeeMembers
                        .filter(m => m.gender === '남' && simulationGameCounts[m.id] < targetGameCount)
                        .sort((a, b) => {
                            if (simulationGameCounts[a.id] !== simulationGameCounts[b.id]) {
                                return simulationGameCounts[a.id] - simulationGameCounts[b.id];
                            }
                            return memberOrderMap[a.id] - memberOrderMap[b.id];
                        });

                    const eligibleFemales = attendeeMembers
                        .filter(m => m.gender === '여' && simulationGameCounts[m.id] < targetGameCount)
                        .sort((a, b) => {
                            if (simulationGameCounts[a.id] !== simulationGameCounts[b.id]) {
                                return simulationGameCounts[a.id] - simulationGameCounts[b.id];
                            }
                            return memberOrderMap[a.id] - memberOrderMap[b.id];
                        });

                    if (eligibleMales.length >= 2 && eligibleFemales.length >= 2) {
                        const selectedMales = eligibleMales.slice(0, 2);
                        const selectedFemales = eligibleFemales.slice(0, 2);

                        const m1 = selectedMales[0].id, m2 = selectedMales[1].id;
                        const f1 = selectedFemales[0].id, f2 = selectedFemales[1].id;

                        const costA = (partnerHistory[[m1, f1].sort().join('_')] || 0) + (partnerHistory[[m2, f2].sort().join('_')] || 0);
                        const costB = (partnerHistory[[m1, f2].sort().join('_')] || 0) + (partnerHistory[[m2, f1].sort().join('_')] || 0);

                        let teamA, teamB;
                        if (costA <= costB) {
                            teamA = [m1, f1]; teamB = [m2, f2];
                        } else {
                            teamA = [m1, f2]; teamB = [m2, f1];
                        }

                        const matchId = 'match_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                        appData.matches.push({
                            id: matchId,
                            round: appData.matches.length + 1,
                            date: appData.sessionDate,
                            teamA: teamA,
                            teamB: teamB,
                            scoreA: null,
                            scoreB: null
                        });

                        [...teamA, ...teamB].forEach(id => simulationGameCounts[id]++);
                        partnerHistory[[teamA[0], teamA[1]].sort().join('_')] = (partnerHistory[[teamA[0], teamA[1]].sort().join('_')] || 0) + 1;
                        partnerHistory[[teamB[0], teamB[1]].sort().join('_')] = (partnerHistory[[teamB[0], teamB[1]].sort().join('_')] || 0) + 1;

                        newMatchesCreated++;
                        matchCreatedInThisPass = true;
                    }

                } else {
                    // Same Gender Doubles Mode
                    const eligibleMales = attendeeMembers
                        .filter(m => m.gender === '남' && simulationGameCounts[m.id] < targetGameCount)
                        .sort((a, b) => {
                            if (simulationGameCounts[a.id] !== simulationGameCounts[b.id]) {
                                return simulationGameCounts[a.id] - simulationGameCounts[b.id];
                            }
                            return memberOrderMap[a.id] - memberOrderMap[b.id];
                        });

                    const eligibleFemales = attendeeMembers
                        .filter(m => m.gender === '여' && simulationGameCounts[m.id] < targetGameCount)
                        .sort((a, b) => {
                            if (simulationGameCounts[a.id] !== simulationGameCounts[b.id]) {
                                return simulationGameCounts[a.id] - simulationGameCounts[b.id];
                            }
                            return memberOrderMap[a.id] - memberOrderMap[b.id];
                        });

                    let group4 = null;

                    if (eligibleMales.length >= 4 && eligibleFemales.length >= 4) {
                        if (simulationGameCounts[eligibleMales[0].id] <= simulationGameCounts[eligibleFemales[0].id]) {
                            group4 = eligibleMales.slice(0, 4);
                        } else {
                            group4 = eligibleFemales.slice(0, 4);
                        }
                    } else if (eligibleMales.length >= 4) {
                        group4 = eligibleMales.slice(0, 4);
                    } else if (eligibleFemales.length >= 4) {
                        group4 = eligibleFemales.slice(0, 4);
                    }

                    if (group4 && group4.length === 4) {
                        const [p1, p2, p3, p4] = group4.map(m => m.id);

                        const c1 = (partnerHistory[[p1, p2].sort().join('_')] || 0) + (partnerHistory[[p3, p4].sort().join('_')] || 0);
                        const c2 = (partnerHistory[[p1, p3].sort().join('_')] || 0) + (partnerHistory[[p2, p4].sort().join('_')] || 0);
                        const c3 = (partnerHistory[[p1, p4].sort().join('_')] || 0) + (partnerHistory[[p2, p3].sort().join('_')] || 0);

                        let teamA, teamB;
                        if (c1 <= c2 && c1 <= c3) {
                            teamA = [p1, p2]; teamB = [p3, p4];
                        } else if (c2 <= c1 && c2 <= c3) {
                            teamA = [p1, p3]; teamB = [p2, p4];
                        } else {
                            teamA = [p1, p4]; teamB = [p2, p3];
                        }

                        const matchId = 'match_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                        appData.matches.push({
                            id: matchId,
                            round: appData.matches.length + 1,
                            date: appData.sessionDate,
                            teamA: teamA,
                            teamB: teamB,
                            scoreA: null,
                            scoreB: null
                        });

                        [...teamA, ...teamB].forEach(id => simulationGameCounts[id]++);
                        partnerHistory[[teamA[0], teamA[1]].sort().join('_')] = (partnerHistory[[teamA[0], teamA[1]].sort().join('_')] || 0) + 1;
                        partnerHistory[[teamB[0], teamB[1]].sort().join('_')] = (partnerHistory[[teamB[0], teamB[1]].sort().join('_')] || 0) + 1;

                        newMatchesCreated++;
                        matchCreatedInThisPass = true;
                    }
                }

                if (!matchCreatedInThisPass) {
                    if (newMatchesCreated === 0) {
                        targetGameCount++;
                    } else {
                        break;
                    }
                }
            }

            if (newMatchesCreated > 0) {
                saveToLocalStorage();
                renderMonthDropdowns();
                showToast(`${targetGameCount}회차 대진표 (${newMatchesCreated}개 경기)가 조합되었습니다!`, 'success');
            } else {
                showToast(`모든 참석자가 이미 한도에 도달하였거나 대진 조합 인원이 부족합니다.`, 'info');
            }

            renderMatchesTabInfo();
            renderMatchesList();
        }

        function updateScore(matchId, team, value) {
            const match = appData.matches.find(m => m.id === matchId);
            if (!match) return;

            const scoreNum = value === '' ? null : parseInt(value, 10);

            if (team === 'A') {
                match.scoreA = isNaN(scoreNum) ? null : scoreNum;
            } else {
                match.scoreB = isNaN(scoreNum) ? null : scoreNum;
            }

            saveToLocalStorage();
            renderStatsTable();
            renderMatchesTabInfo();
            renderMatchesList();
        }

        function clearCurrentMatches() {
            if (appData.matches.length === 0) {
                showToast('초기화할 대진표가 없습니다.', 'info');
                return;
            }

            showConfirmModal(
                '대진표 초기화',
                '생성된 모든 대진표 및 입력된 점수를 삭제하시겠습니까?',
                () => {
                    appData.matches = [];
                    saveToLocalStorage();
                    showToast('대진표가 초기화되었습니다.', 'success');
                    renderMatchesTabInfo();
                    renderMatchesList();
                    renderStatsTable();
                }
            );
        }

        function renderMatchesList() {
            const container = document.getElementById('matches-container');

            if (!container) return;

            let filteredMatches = appData.matches;
            if (appData.selectedMatchMonth && appData.selectedMatchMonth !== 'all') {
                filteredMatches = appData.matches.filter(m => {
                    const matchMonth = (m.date || appData.sessionDate).substring(0, 7);
                    return matchMonth === appData.selectedMatchMonth;
                });
            }

            if (filteredMatches.length === 0) {
                container.innerHTML = `
                    <div id="no-matches-placeholder" class="tennis-card rounded-2xl p-12 text-center text-slate-400">
                        <i class="fa-solid fa-tennis-ball text-4xl text-slate-600 mb-3 block"></i>
                        <p class="text-base font-semibold text-slate-300">선택한 조건에 생성된 경기 대진표가 없습니다.</p>
                        <p class="text-xs text-slate-500 mt-1">상단의 <strong>'팀 조합하기'</strong> 버튼을 눌러 대진을 만들어보세요.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredMatches.map((m, index) => {
                const getMemberName = (id) => {
                    const mem = appData.members.find(x => x.id === id);
                    return mem ? mem.name : '미정';
                };

                const teamANames = m.teamA.map(getMemberName).join(' & ');
                const teamBNames = m.teamB.map(getMemberName).join(' & ');

                const isCompleted = m.scoreA !== null && m.scoreB !== null;
                let statusBadge = `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-slate-800 text-slate-400">진행 예정</span>`;
                
                if (isCompleted) {
                    if (m.scoreA > m.scoreB) {
                        statusBadge = `<span class="px-2 py-0.5 rounded text-xs font-bold bg-emerald-950 text-emerald-300 border border-emerald-800">A팀 승리</span>`;
                    } else if (m.scoreB > m.scoreA) {
                        statusBadge = `<span class="px-2 py-0.5 rounded text-xs font-bold bg-emerald-950 text-emerald-300 border border-emerald-800">B팀 승리</span>`;
                    } else {
                        statusBadge = `<span class="px-2 py-0.5 rounded text-xs font-bold bg-amber-950 text-amber-300 border border-amber-800">무승부</span>`;
                    }
                }

                const matchDateText = m.date || appData.sessionDate;

                return `
                    <div class="tennis-card rounded-2xl p-5 border-l-4 ${isCompleted ? 'border-l-lime-400' : 'border-l-slate-700'} hover:border-slate-500 transition">
                        <div class="flex items-center justify-between mb-3 border-b border-slate-800/80 pb-2">
                            <div class="flex items-center gap-2">
                                <span class="bg-lime-400 text-slate-950 font-black text-xs px-2.5 py-0.5 rounded-md">MATCH ${index + 1}</span>
                                ${statusBadge}
                            </div>
                            <span class="text-xs text-slate-500"><i class="fa-regular fa-calendar text-slate-500 mr-1"></i>${matchDateText}</span>
                        </div>

                        <!-- Teams & Score Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-11 gap-3 items-center">
                            <!-- Team A -->
                            <div class="md:col-span-4 bg-slate-900/90 p-3.5 rounded-xl border border-slate-800 flex items-center justify-between">
                                <div>
                                    <span class="text-xs font-bold text-lime-400 uppercase block">TEAM A</span>
                                    <span class="text-base font-bold text-white tracking-wide">${teamANames}</span>
                                </div>
                                <i class="fa-solid fa-users text-slate-600 text-sm"></i>
                            </div>

                            <!-- Score Input -->
                            <div class="md:col-span-3 flex items-center justify-center gap-2 bg-slate-950/60 p-2 rounded-xl border border-slate-800">
                                <input type="number" min="0" max="99" placeholder="0" value="${m.scoreA !== null ? m.scoreA : ''}"
                                    onchange="updateScore('${m.id}', 'A', this.value)"
                                    class="w-14 h-10 bg-slate-900 border border-slate-700 rounded-lg text-center text-lg font-black text-lime-400 focus:outline-none focus:border-lime-400">
                                <span class="text-slate-500 font-bold text-sm">:</span>
                                <input type="number" min="0" max="99" placeholder="0" value="${m.scoreB !== null ? m.scoreB : ''}"
                                    onchange="updateScore('${m.id}', 'B', this.value)"
                                    class="w-14 h-10 bg-slate-900 border border-slate-700 rounded-lg text-center text-lg font-black text-lime-400 focus:outline-none focus:border-lime-400">
                            </div>

                            <!-- Team B -->
                            <div class="md:col-span-4 bg-slate-900/90 p-3.5 rounded-xl border border-slate-800 flex items-center justify-between">
                                <i class="fa-solid fa-users text-slate-600 text-sm"></i>
                                <div class="text-right">
                                    <span class="text-xs font-bold text-lime-400 uppercase block">TEAM B</span>
                                    <span class="text-base font-bold text-white tracking-wide">${teamBNames}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function calculateAllStatsMap(targetMonth = null) {
            const stats = {};

            appData.members.forEach(m => {
                stats[m.id] = {
                    id: m.id,
                    name: m.name,
                    gender: m.gender,
                    games: 0,
                    wins: 0,
                    losses: 0,
                    draws: 0,
                    pointsFor: 0,
                    pointsAgainst: 0,
                    diff: 0,
                    winRate: '0.0'
                };
            });

            const filterMonth = targetMonth !== null ? targetMonth : appData.selectedStatsMonth;

            appData.matches.forEach(m => {
                const isCompleted = m.scoreA !== null && m.scoreB !== null;
                if (!isCompleted) return;

                if (filterMonth && filterMonth !== 'all') {
                    const matchMonth = (m.date || appData.sessionDate).substring(0, 7);
                    if (matchMonth !== filterMonth) return;
                }

                const scoreA = m.scoreA;
                const scoreB = m.scoreB;

                m.teamA.forEach(pId => {
                    if (stats[pId]) {
                        stats[pId].games++;
                        stats[pId].pointsFor += scoreA;
                        stats[pId].pointsAgainst += scoreB;
                        if (scoreA > scoreB) stats[pId].wins++;
                        else if (scoreA < scoreB) stats[pId].losses++;
                        else stats[pId].draws++;
                    }
                });

                m.teamB.forEach(pId => {
                    if (stats[pId]) {
                        stats[pId].games++;
                        stats[pId].pointsFor += scoreB;
                        stats[pId].pointsAgainst += scoreA;
                        if (scoreB > scoreA) stats[pId].wins++;
                        else if (scoreB < scoreA) stats[pId].losses++;
                        else stats[pId].draws++;
                    }
                });
            });

            Object.values(stats).forEach(s => {
                s.diff = s.pointsFor - s.pointsAgainst;
                s.winRate = s.games > 0 ? ((s.wins / s.games) * 100).toFixed(1) : '0.0';
            });

            return stats;
        }

        function renderStatsTable() {
            const tbody = document.getElementById('stats-table-body');
            if (!tbody) return;

            const statsMap = calculateAllStatsMap();

            const sortedList = Object.values(statsMap).sort((a, b) => {
                if (b.wins !== a.wins) return b.wins - a.wins;
                if (b.diff !== a.diff) return b.diff - a.diff;
                return b.pointsFor - a.pointsFor;
            });

            if (sortedList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center py-8 text-slate-500">등록된 회원이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = sortedList.map((s, index) => {
                const rankBadge = index === 0 ? '<span class="text-amber-400 font-extrabold"><i class="fa-solid fa-crown"></i> 1</span>'
                    : index === 1 ? '<span class="text-slate-300 font-bold">2</span>'
                    : index === 2 ? '<span class="text-amber-600 font-bold">3</span>'
                    : `<span class="text-slate-500 font-mono">${index + 1}</span>`;

                const genderBadge = s.gender === '남' 
                    ? `<span class="text-xs text-blue-400 font-medium">남</span>` 
                    : `<span class="text-xs text-pink-400 font-medium">여</span>`;

                const diffColor = s.diff > 0 ? 'text-emerald-400' : s.diff < 0 ? 'text-rose-400' : 'text-slate-400';
                const formattedDiff = s.diff > 0 ? `+${s.diff}` : s.diff;

                return `
                    <tr class="hover:bg-slate-800/50 transition">
                        <td class="py-3.5 px-4 text-center font-bold">${rankBadge}</td>
                        <td class="py-3.5 px-4 font-bold text-white">${s.name}</td>
                        <td class="py-3.5 px-4">${genderBadge}</td>
                        <td class="py-3.5 px-4 text-center font-semibold text-slate-300">${s.games}</td>
                        <td class="py-3.5 px-4 text-center font-bold text-emerald-400">${s.wins}</td>
                        <td class="py-3.5 px-4 text-center font-bold text-rose-400">${s.losses}</td>
                        <td class="py-3.5 px-4 text-center font-mono font-bold text-lime-400">${s.winRate}%</td>
                        <td class="py-3.5 px-4 text-center text-slate-300">${s.pointsFor}</td>
                        <td class="py-3.5 px-4 text-center text-slate-400">${s.pointsAgainst}</td>
                        <td class="py-3.5 px-4 text-center font-mono font-bold ${diffColor}">${formattedDiff}</td>
                    </tr>
                `;
            }).join('');
        }

        function exportToCSV() {
            const statsMap = calculateAllStatsMap();
            const list = Object.values(statsMap);

            if (list.length === 0) {
                showToast('내보낼 성적 데이터가 없습니다.', 'error');
                return;
            }

            const monthLabel = appData.selectedStatsMonth === 'all' ? '전체누적' : appData.selectedStatsMonth;

            let csvContent = "\uFEFF선수명,성별,총경기수,승,패,승률(%),총득점,총실점,득실차\n";
            list.forEach(s => {
                csvContent += `"${s.name}","${s.gender}",${s.games},${s.wins},${s.losses},${s.winRate},${s.pointsFor},${s.pointsAgainst},${s.diff}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `테니스_회원_성적표_${monthLabel}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('CSV 파일이 다운로드되었습니다.', 'success');
        }

        function renderAll() {
            renderMonthDropdowns();
            renderMemberTable();
            renderAttendanceGrid();
            renderMatchesTabInfo();
            renderMatchesList();
            renderStatsTable();
        }
    </script>
</body>
</html>
